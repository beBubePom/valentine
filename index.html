<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Letter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene">
  <div class="letter" id="letter">

    <div class="fold fold-top"></div>
    <div class="fold fold-middle"></div>

    <div class="paper">
      <div class="text">
        <p>Anh đã nghĩ rất lâu…</p>
        <p>Không phải vì không muốn nói,</p>
        <p>mà vì sợ nói ra rồi sẽ mất.</p>
        <p>Nhưng giữ trong lòng còn đau hơn.</p>
      </div>
    </div>

  </div>
</div>

<p class="hint">Click chậm thôi…</p>

<script src="script.js"></script>
</body>
</html>
